server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Redirecciones relativas (/test -> /test/): si no, Nginx usa su puerto
    # interno (8080) y se rompe cuando el contenedor se publica en otro puerto.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets con hash en el nombre: se pueden cachear para siempre.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # trailingSlash: true genera /test/index.html, /resultado/index.html, etc.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
